<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر ولاد سي أحمد</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding: 20px; }
        
        header {
            background-color: #ffffff; padding: 15px 25px; border-radius: 12px;
            border: 1px solid #e2e8f0; display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        .logo-title { display: flex; align-items: center; gap: 15px; }
        .logo-icon { width: 45px; height: 45px; background-color: #2563eb; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 22px; }
        h1 { color: #2563eb; font-size: 24px; }
        
        .btn-admin {
            background-color: #0f172a; color: white; border: none; padding: 10px 16px;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-admin:hover { background-color: #334155; }

        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .products-grid { flex: 2; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; min-width: 300px; }
        .product-card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; text-align: center; }
        .product-card:hover { border-color: #2563eb; }
        .product-img { width: 80px; height: 80px; background-color: #e2e8f0; border-radius: 8px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        .product-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .product-price { color: #2563eb; font-weight: bold; font-size: 15px; }
        .product-stock { font-size: 12px; color: #64748b; margin-bottom: 10px; }
        
        .btn-add { background-color: #f1f5f9; color: #1e293b; border: 1px solid #cbd5e1; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-add:hover { background-color: #2563eb; color: white; border-color: #2563eb; }

        .cart-section { flex: 1; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; min-width: 300px; height: fit-content; }
        .cart-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { padding: 8px; text-align: right; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #f8fafc; color: #475569; }
        .total-price { font-size: 20px; font-weight: bold; color: #16a34a; margin: 15px 0; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #475569; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        
        .btn-order { background-color: #16a34a; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        .btn-order:hover { background-color: #15803d; }

        /* نافذة إدارة الستوك (Modal) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 700px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-btn { font-size: 20px; cursor: pointer; border: none; background: none; }
        .admin-table input { width: 100%; padding: 4px; }
        .btn-save { background-color: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-delete { background-color: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">
            <div class="logo-icon">🛒</div>
            <h1>متجر ولاد سي أحمد</h1>
        </div>
        <button class="btn-admin" onclick="openAdminModal()">⚙️ إدارة الستوك</button>
    </header>

    <div class="container">
        <div class="products-grid" id="products-grid"></div>

        <div class="cart-section">
            <div class="cart-title">سلة الشراء 🛒</div>
            <table>
                <thead>
                    <tr><th>المنتج</th><th>الكمية</th><th>المجموع</th></tr>
                </thead>
                <tbody id="cart-items">
                    <tr><td colspan="3" style="text-align: center; color: #94a3b8;">السلة فارغة</td></tr>
                </tbody>
            </table>
            <div class="total-price" id="total-price">المجموع: 0.00 DH</div>
            <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 15px 0;">

            <div class="cart-title" style="font-size: 16px;">معلومات التوصيل 🛵</div>
            <div class="form-group"><label>الاسم الكامل:</label><input type="text" id="client-name" placeholder="أدخل اسمك"></div>
            <div class="form-group"><label>رقم الهاتف:</label><input type="tel" id="client-phone" placeholder="06XXXXXXXX"></div>
            <div class="form-group"><label>عنوان التوصيل:</label><textarea id="client-address" rows="2" placeholder="الحي، رقم الدار..."></textarea></div>

            <button class="btn-order" onclick="submitOrder()">تأكيد الطلب عبر WhatsApp 🚀</button>
        </div>
    </div>

    <!-- نافذة التحكم بالستوك -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ لوحة إدارة الستوك</h3>
                <button class="close-btn" onclick="closeAdminModal()">✕</button>
            </div>
            
            <h4 style="margin-bottom: 10px;">إضافة منتج جديد:</h4>
            <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                <input type="text" id="new-name" placeholder="اسم السلعة" style="flex:1; padding: 6px;">
                <input type="number" id="new-price" placeholder="الثمن (DH)" style="width: 100px; padding: 6px;">
                <input type="number" id="new-stock" placeholder="الستوك" style="width: 80px; padding: 6px;">
                <input type="text" id="new-icon" placeholder="إيموجي 🍾" style="width: 80px; padding: 6px;">
                <button class="btn-save" onclick="addProduct()">إضافة ➕</button>
            </div>

            <h4>تعديل السلع الحالية:</h4>
            <table class="admin-table">
                <thead>
                    <tr><th>الاسم</th><th>الثمن</th><th>الستوك</th><th>حذف</th></tr>
                </thead>
                <tbody id="admin-products-list"></tbody>
            </table>
        </div>
    </div>

    <script>
        const defaultProducts = [
            { id: '101', name: 'زيت لوحة 1L', price: 20.00, stock: 50, icon: '🍾' },
            { id: '102', name: 'ماء جافيل أتاك', price: 6.00, stock: 40, icon: '🧴' },
            { id: '103', name: 'سكّر قالب (2kg)', price: 13.00, stock: 60, icon: '🧊' },
            { id: '104', name: 'أتاي السبع', price: 12.00, stock: 45, icon: '🍃' },
            { id: '105', name: 'تيد غسيل 500g', price: 10.00, stock: 30, icon: '🧼' },
            { id: '106', name: 'بيمو هنريس', price: 2.00, stock: 100, icon: '🍪' },
            { id: '107', name: 'حليب السنترال 1L', price: 3.50, stock: 80, icon: '🥛' },
            { id: '108', name: 'دانون فواكه', price: 2.50, stock: 60, icon: '🍧' },
            { id: '109', name: 'زبدة بدوية 250g', price: 15.00, stock: 25, icon: '🧈' }
        ];

        // جلب المنتجات من ذاكرة المتصفح أولاً
        let products = JSON.parse(localStorage.getItem('products_data')) || defaultProducts;
        let cart = {};

        function saveProducts() {
            localStorage.setItem('products_data', JSON.stringify(products));
            renderProducts();
            renderAdminProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-img">${p.icon || '📦'}</div>
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${parseFloat(p.price).toFixed(2)} DH</div>
                        <div class="product-stock">المتوفر: ${p.stock}</div>
                        <button class="btn-add" onclick="addToCart('${p.id}')" ${p.stock <= 0 ? 'disabled' : ''}>
                            ${p.stock > 0 ? 'إضافة للسلة ➕' : 'غير متوفر ❌'}
                        </button>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            let currentQty = cart[id] ? cart[id].qty : 0;
            if (currentQty + 1 > product.stock) {
                alert('وصلت للحد الأقصى المتوفر في الستوك!');
                return;
            }

            if (cart[id]) {
                cart[id].qty += 1;
            } else {
                cart[id] = { name: product.name, price: product.price, qty: 1 };
            }
            updateCart();
        }

        function updateCart() {
            const cartItems = document.getElementById('cart-items');
            const totalPriceEl = document.getElementById('total-price');
            cartItems.innerHTML = '';
            let total = 0;
            const keys = Object.keys(cart);

            if (keys.length === 0) {
                cartItems.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #94a3b8;">السلة فارغة</td></tr>';
                totalPriceEl.innerText = 'المجموع: 0.00 DH';
                return;
            }

            keys.forEach(id => {
                const item = cart[id];
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                cartItems.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td>${item.qty}</td>
                        <td>${itemTotal.toFixed(2)} DH</td>
                    </tr>
                `;
            });
            totalPriceEl.innerText = `المجموع: ${total.toFixed(2)} DH`;
        }

        function submitOrder() {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();
            const address = document.getElementById('client-address').value.trim();

            if (Object.keys(cart).length === 0) { alert('السلة فارغة!'); return; }
            if (!name || !phone || !address) { alert('يرجى ملء كافة معلومات التوصيل!'); return; }

            // نقص الكمية من الستوك عند الطلب
            Object.keys(cart).forEach(id => {
                let p = products.find(prod => prod.id === id);
                if (p) p.stock -= cart[id].qty;
            });
            saveProducts();

            let myPhone = "212667903785";
            let itemsList = "";
            let total = 0;

            Object.values(cart).forEach(item => {
                let itemTotal = item.price * item.qty;
                total += itemTotal;
                itemsList += `- ${item.name} (الكمية: ${item.qty}) = ${itemTotal.toFixed(2)} DH\n`;
            });

            let msg = `🛍️ *طلب جديد من المتجر*\n\n👤 *اسم الزبون:* ${name}\n📞 *الهاتف:* ${phone}\n📍 *العنوان:* ${address}\n\n📋 *المنتجات:*\n${itemsList}\n💰 *المجموع الإجمالي:* ${total.toFixed(2)} DH`;
            window.open(`https://wa.me/${myPhone}?text=${encodeURIComponent(msg)}`, '_blank');
            
            cart = {};
            updateCart();
        }

        /* ووظائف إدارة الستوك */
        function openAdminModal() {
            renderAdminProducts();
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function renderAdminProducts() {
            const list = document.getElementById('admin-products-list');
            list.innerHTML = '';
            products.forEach((p, idx) => {
                list.innerHTML += `
                    <tr>
                        <td><input type="text" value="${p.name}" onchange="updateProduct(${idx}, 'name', this.value)"></td>
                        <td><input type="number" value="${p.price}" onchange="updateProduct(${idx}, 'price', this.value)"></td>
                        <td><input type="number" value="${p.stock}" onchange="updateProduct(${idx}, 'stock', this.value)"></td>
                        <td><button class="btn-delete" onclick="deleteProduct(${idx})">🗑️</button></td>
                    </tr>
                `;
            });
        }

        function updateProduct(index, field, value) {
            if (field === 'price' || field === 'stock') value = parseFloat(value) || 0;
            products[index][field] = value;
            saveProducts();
        }

        function addProduct() {
            const name = document.getElementById('new-name').value.trim();
            const price = parseFloat(document.getElementById('new-price').value);
            const stock = parseInt(document.getElementById('new-stock').value);
            const icon = document.getElementById('new-icon').value.trim() || '📦';

            if (!name || isNaN(price) || isNaN(stock)) {
                alert('أدخل بيانات المنتج بشكل صحيح!');
                return;
            }

            products.push({ id: Date.now().toString(), name, price, stock, icon });
            saveProducts();

            document.getElementById('new-name').value = '';
            document.getElementById('new-price').value = '';
            document.getElementById('new-stock').value = '';
            document.getElementById('new-icon').value = '';
        }

        function deleteProduct(index) {
            if (confirm('هل أنت تأكد من حذف هاد المنتج؟')) {
                products.splice(index, 1);
                saveProducts();
            }
        }

        renderProducts();
    </script>
</body>
</html>
